<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Gallery 📷</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <!-- Music continues playing on gallery page -->
    <div class="music-toggle" id="musicToggle" onclick="toggleMusic()">🎵</div>
    <audio id="bgMusic" loop>
        <source src="music/Bruno Mars - Count on Me (Official Lyric Video)(MP3_160K).mp3" type="audio/mpeg">
    </audio>

    <div class="gallery-page">
        <a href="index.html" class="back-btn">← back</a>
        
        <h1 class="gallery-title">our moments ✨</h1>
        <p class="gallery-subtitle">every photo tells a story</p>
        
        <div class="gallery-grid" id="galleryGrid">
            <!-- Photos will be added here -->
            <div class="add-photo-card" onclick="openUpload()">
                <span class="plus-icon">+</span>
                <span class="add-text">add a memory</span>
            </div>
        </div>

        <div class="upload-modal" id="uploadModal">
            <div class="modal-content">
                <h2>add a photo 📷</h2>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 15px;">
                    Images are automatically compressed to save space ✨
                </p>
                <input type="file" id="photoInput" accept="image/*" onchange="previewPhoto(event)">
                <div class="preview-container" id="previewContainer">
                    <img id="previewImage" src="" alt="Preview">
                </div>
                <input type="text" id="captionInput" placeholder="add a caption..." maxlength="100">
                <div class="modal-buttons">
                    <button onclick="savePhoto()">save photo</button>
                    <button class="skip-btn" onclick="closeUpload()">cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
